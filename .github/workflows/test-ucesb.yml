name: Test ucesb on macOS

on:
  push:    # Runs on all branches
#    branches: [ main ]
  pull_request:    # Runs on all PRs
#    branches: [ main ]

jobs:
  test-macos:
    strategy:
      fail-fast: false  # Critical: Allows all matrix jobs to complete
      matrix:
        os: [macos-13, macos-latest]
        # os: [macos-13, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew update
        brew install git make gcc

    - name: Clone ucesb (SSH or HTTPS fallback)
      run: |
        git clone git@git.chalmers.se:expsubphys/ucesb.git || git clone https://git.chalmers.se/expsubphys/ucesb.git
        ls -la ucesb/  # Verify clone succeeded

    - name: Build empty unpacker
      working-directory: ./ucesb
      run: make empty

    - name: Test with simulated input
      working-directory: ./ucesb
      run: |
        file_input/empty_file --lmd | empty/empty --file=-
        echo "Basic test completed successfully"